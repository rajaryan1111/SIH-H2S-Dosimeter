name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r software/backend/requirements.txt
      - run: python -m pip install pytest
      - run: pytest -q software/backend

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: software/dashboard/package-lock.json
      - run: npm ci
        working-directory: software/dashboard
      - run: npm run lint
        working-directory: software/dashboard
      - run: npm run build
        working-directory: software/dashboard

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: software/mobile_app/package-lock.json
      - run: npm ci
        working-directory: software/mobile_app
      - run: npm run lint
        working-directory: software/mobile_app
      - run: npm test
        working-directory: software/mobile_app
      - run: npm run build
        working-directory: software/mobile_app
